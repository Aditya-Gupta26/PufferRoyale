<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<title>PufferRoyale play</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0f1419;
         color: #e6e9ed; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 440px; padding: 24px; text-align: center; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 6px 0; color: #9aa7b4; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #f2c94c; margin-right: 6px;
         animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
</style>
</head>
<body>
<main>
  <h1>PufferRoyale: play against the policy</h1>
  <p id="msg"><span class="dot"></span>Finding the game server…</p>
  <p id="sub" style="font-size:13px"></p>
</main>
<script>
// The permanent link of the PufferRoyale play site (an unofficial research simulator). The game server runs on a
// university cluster behind a Cloudflare quick tunnel whose address changes every two days; target.json (kept
// current by the site job, play/play_link.py) names the current one and the site's public access token (the owner
// chose an open link on 2026-11-09; players sign in with name + PIN). This page sends the visitor there with that
// token (an older ?token= in the visitor's link is replaced, so links keep working after the token changes; any
// other parameter such as &owner= is kept), after checking that the server answers.
const REPO = "__REPO__";
const OK_URL = /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/;
const OK_TOKEN = /^[A-Za-z0-9_-]{8,64}$/;
const OK_PID = /^[A-Za-z0-9_-]{8,64}$/;
const LOCAL = location.hostname === "127.0.0.1";                // a local test copy may forward to a local server
const okUrl = u => OK_URL.test(u) || (LOCAL && /^http:\/\/127\.0\.0\.1:[0-9]+$/.test(u));
const HOME = location.origin + location.pathname.replace(/index\.html$/, "");
const $ = id => document.getElementById(id);
function mem(k, v) {
  try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); }
  catch (e) { return null; }
}
// Remembered sign-in (2026-11-17, the owner's request): the game's own address changes every two days and a browser
// keeps a sign-in per address, so THIS page (whose address never changes) keeps the player's id on this device and
// hands it to the game in the address's #fragment, which browsers never send to any server. The game sends it back
// here after a sign-in (#save=<id>&back=<game>) or a sign-out (#forget=1&back=<game>); "back" must be a game address.
function handoff() {
  const h = new URLSearchParams(location.hash.slice(1));
  let back;
  try { back = new URL(h.get("back") || ""); } catch (e) { return false; }
  if (!okUrl(back.origin)) return false;
  if (OK_PID.test(h.get("save") || "")) { mem("pr_pid", h.get("save")); mem("pr_out", null); }
  else if (h.get("forget")) { mem("pr_pid", null); mem("pr_out", "1"); }   // signed out: other addresses forget too
  else return false;
  back.hash = "";
  location.replace(back.href);
  return true;
}
async function readTarget() {
  const tries = [["https://api.github.com/repos/" + REPO + "/contents/target.json", {Accept: "application/vnd.github.raw+json"}],
                 ["target.json?t=" + Date.now(), {}]];             // this site's own copy (may lag a few minutes)
  for (const [u, h] of tries) {
    try { const r = await fetch(u, {headers: h, cache: "no-store"}); if (r.ok) return await r.json(); } catch (e) {}
  }
  return null;
}
async function alive(url) {
  try {
    const c = new AbortController(); const t = setTimeout(() => c.abort(), 8000);
    const r = await fetch(url + "/api/alive", {cache: "no-store", signal: c.signal}); clearTimeout(t);
    return r.ok;
  } catch (e) { return false; }
}
let waits = 0;
async function go() {
  const t = await readTarget();
  if (t && t.status === "up" && okUrl(t.url) && await alive(t.url)) {
    $("msg").textContent = "Taking you to the game…";
    const q = new URLSearchParams(location.search);
    if (t.token && OK_TOKEN.test(t.token)) q.set("token", t.token);
    const qs = q.toString();
    const f = new URLSearchParams({home: HOME});               // the game checks this address before trusting the id
    const pid = mem("pr_pid");
    if (pid && OK_PID.test(pid)) f.set("pid", pid);
    else if (mem("pr_out")) f.set("out", "1");
    location.replace(t.url + "/" + (qs ? "?" + qs : "") + "#" + f.toString());
    return;
  }
  waits++;
  $("msg").innerHTML = '<span class="dot"></span>The game server is restarting (it moves every two days).';
  $("sub").textContent = "This page keeps trying by itself" + (waits > 1 ? " (tried " + waits + " times)" : "") +
    ". If it takes long, try again later.";
  setTimeout(go, Math.min(60000, 15000 + 5000 * waits));
}
if (!handoff()) go();
</script>
</body>
</html>
