; PufferRoyale training config, PufferLib 3.0 format (merged over pufferlib's default.ini
; by scripts/train.py via pufferlib.pufferl.load_config_file). Any key can be overridden on
; the command line as --section.key value, e.g. --train.learning-rate 1e-4 --env.opponent random.
;
; Defaults are sized for a local CPU smoke run (Apple M4, 16 GB). One observation row is
; 17,707 float32 = 70.8 KB (v0.3 layout, SPEC §16.4), so the rollout buffer costs batch_size x 70.8 KB
; (4096 -> 290 MB).
; On a cluster raise vec.num_envs / env.num_envs and train.batch_size together.

[base]
package = pufferroyale
env_name = pufferroyale
policy_name = Policy
rnn_name = None

[vec]
; PufferEnv = native vectorization in this process (env.num_envs matches per process);
; Multiprocessing = vec.num_envs worker processes, each a Royale with env.num_envs matches.
backend = PufferEnv
num_envs = 1
num_workers = auto
batch_size = auto
zero_copy = True
seed = 42

[env]
num_envs = 16
num_agents = 2
frame_skip = 10
deck0 = hog26
deck1 = hog26
; SPEC §16.3: princess | cannoneer | dagger_duchess | royal_chef (replaces both Princess towers)
tower_troop0 = princess
tower_troop1 = princess
opponent = heuristic
learner_side = random
deploy_lockout_ticks = 90
tiebreak = absolute
reward_tower = 0.0
reward_crown = 0.0
bot_play_prob = 0.2
log_interval = 32

[policy]
hidden_size = 256
cnn_channels = 64
entity_hidden = 128
scalar_hidden = 128
card_dim = 16

[rnn]
input_size = 256
hidden_size = 256

[train]
name = pufferroyale
project = pufferroyale
seed = 42
torch_deterministic = True
cpu_offload = False
device = cpu
optimizer = adam
precision = float32
compile = False
total_timesteps = 10_000_000
learning_rate = 0.0003
anneal_lr = True
min_lr_ratio = 0.0
gamma = 0.999
gae_lambda = 0.95
update_epochs = 1
clip_coef = 0.2
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.01
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
data_dir = experiments
checkpoint_interval = 50
batch_size = 4096
minibatch_size = 1024
max_minibatch_size = 1024
bptt_horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.8
prio_beta0 = 0.2

[sweep]
; SPEC v0.2.1 §14.6: sweeps optimise the learner's score (win 1 / draw 0.5 / loss 0 from the
; policy's seat: the policy's team with num_agents = 1, team 0 in self-play). PufferLib's
; default metric `score` is team 0's score, which in 1-agent mode with learner_side = random
; is not the policy's.
method = Protein
metric = learner_score
metric_distribution = linear
goal = maximize
